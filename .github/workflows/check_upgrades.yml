name: Check Clash Upgrades

on:
  schedule:
    # 每5分钟检查一次（GitHub Actions 使用 UTC 时间）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      game_data:
        description: '从游戏复制的 JSON 数据（粘贴到这里即可更新游戏数据）'
        required: false
        type: string
      test_mode:
        description: '发送测试通知（会跳过正常检查）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: check-upgrades
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update game_data.json
        if: ${{ inputs.game_data != '' }}
        run: |
          cat << 'GAMEDATA_EOF' > game_data.json
          ${{ inputs.game_data }}
          GAMEDATA_EOF

      - name: Run upgrade check
        env:
          NOTIFY_PROVIDER: ${{ secrets.NOTIFY_PROVIDER || 'ntfy' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_MODE: ${{ inputs.test_mode || false }}
        run: node scripts/check_upgrades.js

      - name: Commit changes
        if: ${{ !inputs.test_mode }}
        run: |
          git config user.name "Clash Bot"
          git config user.email "clash-bot@users.noreply.github.com"
          git add notified_items.json game_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update game data [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && break || echo "Pull attempt $i failed, retrying..."
            done
            git push origin main || { echo "Push failed, will retry next run"; exit 1; }
          fi
