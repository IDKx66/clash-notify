name: Check Clash Upgrades

on:
  schedule:
    # 每5分钟检查一次（GitHub Actions 使用 UTC 时间）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '发送测试通知（会跳过正常检查）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run upgrade check
        env:
          NOTIFY_PROVIDER: ${{ secrets.NOTIFY_PROVIDER || 'ntfy' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TEST_MODE: ${{ inputs.test_mode || false }}
        run: node scripts/check_upgrades.js

      - name: Commit notified_items.json
        # 测试模式不提交
        if: ${{ !inputs.test_mode }}
        run: |
          git config user.name "Clash Bot"
          git config user.email "clash-bot@users.noreply.github.com"
          git add notified_items.json
          if git diff --staged --quiet; then
            echo "No changes to notified_items.json"
          else
            git commit -m "Update notified items [skip ci]"
            git push
            echo "Pushed notified_items.json update"
          fi
